name: Sync Strava activities

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # cada 15 min, desplazado para evitar la hora en punto
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar actividades de Strava
        run: node scripts/update-strava.mjs
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strava.json
          if git diff --staged --quiet; then
            echo "Sin cambios en las actividades."
          else
            git commit -m "chore: sync Strava activities"
            git push
          fi
